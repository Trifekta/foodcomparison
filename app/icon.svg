<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SnipSavor">
  <!-- The SnipSavor lockup reduced to what survives a 16px browser tab: the S
       of the wordmark, held inside the crop frame.

       The frame alone was the previous mark, and four thin brackets around an
       empty gold square read as a camera reticle rather than as a brand - at
       tab size there was nothing to recognise, only a texture. A letter gives
       the eye something to land on; the brackets keep it ours.

       The S is the outline of Plus Jakarta Sans ExtraBold, the same face the
       wordmark is set in, so the tab and the header are the same letter rather
       than two shapes that nearly match. Drawn as a path and not as text,
       because a favicon renders in contexts with no webfont - and often with
       no font stack worth the name at all.

       Colours are the brand tokens: brand-400 ground, ink-900 mark. Gold is
       doing the recognition work here; at 16px the shapes blur first and the
       colour is what is still legible across a row of tabs. -->
  <rect width="64" height="64" rx="14" fill="#ffd84d"/>
  <g fill="none" stroke="#12121a" stroke-width="4.5" stroke-linecap="round">
    <path d="M17,7 h-6.5 a3.5,3.5 0 0 0 -3.5,3.5 v6.5"/>
    <path d="M47,7 h6.5 a3.5,3.5 0 0 1 3.5,3.5 v6.5"/>
    <path d="M57,47 v6.5 a3.5,3.5 0 0 1 -3.5,3.5 h-6.5"/>
    <path d="M7,47 v6.5 a3.5,3.5 0 0 0 3.5,3.5 h6.5"/>
  </g>
  <path fill="#12121a" d="M32.99 52.0Q29.35 52.0 26.15 50.67Q22.95 49.35 20.63 46.9Q18.32 44.46 17.18 41.13L23.78 38.16Q25.24 41.34 27.81 43.16Q30.39 44.98 33.51 44.98Q35.17 44.98 36.37 44.46Q37.57 43.94 38.24 43.03Q38.92 42.12 38.92 40.87Q38.92 39.52 38.09 38.55Q37.25 37.59 35.49 37.02L27.89 34.52Q23.26 33.01 20.92 30.23Q18.58 27.45 18.58 23.55Q18.58 20.11 20.27 17.51Q21.96 14.91 25.0 13.46Q28.05 12.0 32.0 12.0Q35.49 12.0 38.45 13.2Q41.41 14.39 43.57 16.58Q45.73 18.76 46.82 21.83L40.27 24.8Q39.18 22.09 36.99 20.56Q34.81 19.02 32.0 19.02Q30.39 19.02 29.14 19.54Q27.89 20.06 27.21 21.02Q26.54 21.99 26.54 23.24Q26.54 24.59 27.42 25.6Q28.31 26.62 30.08 27.19L37.51 29.58Q42.2 31.09 44.51 33.79Q46.82 36.5 46.82 40.4Q46.82 43.78 45.06 46.41Q43.29 49.04 40.19 50.52Q37.1 52.0 32.99 52.0Z"/>
</svg>
