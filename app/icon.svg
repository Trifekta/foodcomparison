<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SnipSavor">
  <!-- The crop frame from the wordmark, alone. At 16px a letterform turns to
       mush, but four brackets still read as "take a screenshot", which is the
       one instruction the whole product depends on. -->
  <rect width="64" height="64" rx="16" fill="#ffd84d"/>
  <g fill="none" stroke="#12121a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M25 15h-6a4 4 0 0 0-4 4v6"/>
    <path d="M39 15h6a4 4 0 0 1 4 4v6"/>
    <path d="M49 39v6a4 4 0 0 1-4 4h-6"/>
    <path d="M15 39v6a4 4 0 0 0 4 4h6"/>
  </g>
  <circle cx="32" cy="32" r="5.5" fill="#12121a"/>
</svg>
